# use prefix C-q
set -g prefix C-q

# use UTF8
#set -g utf8
#set-window-option -g utf8 on
#set-option -g status-utf8 on

set-option -g base-index 1

bind -T copy-mode-vi y send -X copy-selection \; send -X clear-selection

bind-key -T prefix '`' select-window -t :=0

# make tmux display things in 256 colors
set -g default-terminal "screen-256color"

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# shorten command delay
set -sg escape-time 1

# set vi mode
set -g status-keys vi
setw -g mode-keys vi

# use PREFIX | to split window horizontally and PREFIX - to split vertically
# 优先用 shell 上报的逻辑路径（保留 symlink），否则回退物理路径
bind | split-window -h -c "#{?@logical_path,#{@logical_path},#{pane_current_path}}"
bind - split-window -v -c "#{?@logical_path,#{@logical_path},#{pane_current_path}}"

#bind-key s select-pane -t 1 \; send-keys C-c Up C-m \; last-pane
bind-key s select-pane -t 1 \; send-keys Up C-m \; last-pane

# set windows color
#set-window-option -g window-status-current-fg colour166
#set-window-option -g window-status-current-bg default

# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-M-n split-window -h -c "#{?@logical_path,#{@logical_path},#{pane_current_path}}"
bind -n C-M-m split-window -v -c "#{?@logical_path,#{@logical_path},#{pane_current_path}}"

# Enable mouse support in ~/.tmux.conf
# set-option -g mouse-select-pane on
# set-option -g mouse-select-window on
# set-window-option -g mode-mouse on
set -g mouse off

# reload config
unbind r
bind r source-file ~/.tmux.conf

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# synchronize all panes in a window
bind y setw synchronize-panes

# turn off windows title automatic rename
set-window-option -g allow-rename off

# Status bar
  # colors
  set -g status-bg black
  set -g status-fg white

  # alignment
  set-option -g status-justify centre

  # spot at left
  set-option -g status-left '#[bg=black,fg=green][#[fg=cyan]#S#[fg=green]]'
  set-option -g status-left-length 20

  # window list
  setw -g automatic-rename on
  set-window-option -g window-status-format '#[dim]#I:#[default]#W#[fg=grey,dim]'
  set-window-option -g window-status-current-format '#[fg=cyan,bold]#I#[fg=blue]:#[fg=cyan]#W#[fg=dim]'

  # spot at right
  set -g status-right '#[fg=green][#[fg=cyan]%Y-%m-%d#[fg=green]]'

# set tmux to use zsh
set-option -g default-shell /bin/zsh

# Export current pane (colors + full scrollback) to HTML via aha
bind-key E run-shell '\
  f="/tmp/tmux-#{session_name}-#{window_index}-#{pane_index}-$(date +%Y%m%d-%H%M%S).html"; \
  tmux capture-pane -ep -S - -t "#{pane_id}" | aha --black --title "tmux #{session_name}:#{window_index}.#{pane_index}" > "$f" \
  && tmux display-message "HTML saved: $f" \
  || tmux display-message "aha export failed"'
